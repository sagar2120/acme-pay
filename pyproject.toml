[project]
name = "acme-pay"
version = "0.1.0"
description = "Salary management for ACME's HR manager"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "sqlalchemy>=2.0,<2.1",
    "pydantic>=2.9,<3",
    "uvicorn[standard]>=0.32,<1",
    "python-multipart>=0.0.12,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "ruff>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
